  # PostgreSQL Database
  identity-db:
    image: postgres:16-alpine
    container_name: booking-identity-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trung
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=identitydb
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trung -d identitydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Seq for logging
  seq:
    image: datalust/seq:latest
    container_name: booking-seq
    ports:
      - "5341:80"
      - "5342:5341"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge

volumes:
  identity-data:
    driver: local